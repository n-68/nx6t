<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; background: #000; display: flex; align-items: center; justify-content: center; }
#bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.70); }
#bgOverlay { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.15); }
#intro { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 1s ease; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#intro.ready { cursor: pointer; }

.intro-ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.6); animation: ringPulse 2.4s ease-in-out infinite; }
.ring-1 { width: 90px; height: 90px; animation-delay: 0s; opacity: 0.5; }
.ring-2 { width: 64px; height: 64px; animation-delay: 0.4s; opacity: 0.7; }
.ring-3 { width: 42px; height: 42px; animation-delay: 0.8s; opacity: 0.9; }
.intro-core { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(255,255,255,0.3); animation: corePulse 2.4s ease-in-out infinite; }
@keyframes ringPulse { 0%,100%{transform:scale(1);opacity:0.4} 50%{transform:scale(1.08);opacity:0.9} }
@keyframes corePulse { 0%,100%{transform:scale(1);box-shadow:0 0 8px rgba(255,255,255,0.9),0 0 20px rgba(255,255,255,0.5)} 50%{transform:scale(1.2);box-shadow:0 0 14px rgba(255,255,255,1),0 0 36px rgba(255,255,255,0.7)} }
#introHint { font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; }
#introHint.visible { opacity: 1; transform: translateY(0); animation: pulse 2s ease-in-out 0.5s infinite; }
@keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
#card { position: relative; z-index: 10; width: 340px; padding: 20px 20px 16px; border-radius: 18px; background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 4px 24px rgba(0,0,0,0.2); opacity: 0; transform: translateY(60px); pointer-events: none; transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22,1,0.36,1); }
#card.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-info { flex: 1; min-width: 0; }
.name { font-size: 20px; font-weight: 700; letter-spacing: 0.03em; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.9),0 0 20px rgba(255,255,255,0.5),0 0 40px rgba(255,255,255,0.25); margin-bottom: 4px; }
.bio { font-size: 13px; color: rgba(255,255,255,0.65); height: 20px; display: flex; align-items: center; gap: 1px; }
.cursor { display: inline-block; animation: blink 1s step-end infinite; color: rgba(255,255,255,0.5); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.divider { height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); margin-bottom: 14px; }
.socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
.icon-btn { display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.88); color: #000; text-decoration: none; transition: transform 0.2s ease, background 0.2s ease; -webkit-tap-highlight-color: transparent; }
.icon-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.95); }
.card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.location { color: rgba(255,255,255,0.5); }
.views { color: #fff; font-weight: 600; font-size: 13px; text-shadow: 0 0 8px rgba(255,255,255,0.9),0 0 18px rgba(255,255,255,0.5); }
.views-label { color: rgba(255,255,255,0.45); font-size: 11px; font-weight: 400; }
@media(max-width:380px){#card{width:92vw}}

<script>
var SUBTITLE='Miyano shiho',twIdx=0,twDel=false,bioEl=document.getElementById('bioText');
function typeLoop(){if(!twDel){if(twIdx<SUBTITLE.length){bioEl.textContent=SUBTITLE.substring(0,++twIdx);setTimeout(typeLoop,100);}else{setTimeout(function(){twDel=true;typeLoop();},1200);}}else{if(twIdx>0){bioEl.textContent=SUBTITLE.substring(0,--twIdx);setTimeout(typeLoop,50);}else{twDel=false;typeLoop();}}}
typeLoop();
var intro=document.getElementById('intro'),hint=document.getElementById('introHint'),card=document.getElementById('card'),audio=document.getElementById('bgAudio');
setTimeout(function(){hint.classList.add('visible');intro.classList.add('ready');},1800);
intro.addEventListener('click',function(){if(!intro.classList.contains('ready'))return;intro.classList.add('hidden');card.classList.add('visible');audio.volume=0.5;audio.play().catch(function(){});});
fetch('/api/views').then(function(r){return r.json();}).then(function(d){if(d.count)document.getElementById('viewsCount').textContent=d.count.toLocaleString();}).catch(function(){});
</script>
