<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GitHub File Uploader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h2 { font-size: 20px; margin-bottom: 6px; }
  p.sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 5px; margin-top: 14px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 9px 12px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #58a6ff; }
  .file-area {
    margin-top: 14px;
    border: 2px dashed #30363d;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .file-area:hover { border-color: #58a6ff; }
  .file-area input { display: none; }
  .file-area span { font-size: 13px; color: #8b949e; }
  .file-name { margin-top: 8px; font-size: 13px; color: #58a6ff; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 11px;
    background: #238636;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  .status.success { background: #1a3a1a; border: 1px solid #238636; color: #3fb950; display: block; }
  .status.error   { background: #3a1a1a; border: 1px solid #da3633; color: #f85149; display: block; }
  .status.loading { background: #1a2a3a; border: 1px solid #388bfd; color: #58a6ff; display: block; }
  a.hint {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: #58a6ff;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <h2>GitHub File Uploader</h2>
  <p class="sub">Upload files directly to your GitHub repository</p>

  <label>GitHub Token <span style="color:#f85149">*</span></label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"/>
  <a class="hint" href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">
    → Get a token here (check the "repo" scope)
  </a>

  <label>GitHub Username</label>
  <input type="text" id="username" placeholder="your-username"/>

  <label>Repository Name</label>
  <input type="text" id="repo" placeholder="your-repo-name"/>

  <label>Branch</label>
  <input type="text" id="branch" placeholder="main" value="main"/>

  <label>File to Upload</label>
  <div class="file-area" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" onchange="onFileChange(this)"/>
    <span>Click to choose a file</span>
    <div class="file-name" id="fileName"></div>
  </div>

  <button id="uploadBtn" onclick="upload()" disabled>Upload to GitHub</button>

  <div class="status" id="status"></div>
</div>

<script>
let selectedFile = null;

function onFileChange(input) {
  selectedFile = input.files[0];
  document.getElementById('fileName').textContent = selectedFile ? selectedFile.name : '';
  document.getElementById('uploadBtn').disabled = !selectedFile;
}

async function upload() {
  const token    = document.getElementById('token').value.trim();
  const username = document.getElementById('username').value.trim();
  const repo     = document.getElementById('repo').value.trim();
  const branch   = document.getElementById('branch').value.trim() || 'main';
  const status   = document.getElementById('status');

  if (!token || !username || !repo || !selectedFile) {
    showStatus('error', 'Please fill in all fields and choose a file.');
    return;
  }

  showStatus('loading', 'Reading file...');
  document.getElementById('uploadBtn').disabled = true;

  try {
    const base64 = await toBase64(selectedFile);
    const path   = selectedFile.name;
    const url    = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

    showStatus('loading', 'Uploading to GitHub...');

    // Check if file already exists (need SHA to update)
    let sha = null;
    const check = await fetch(url, {
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
    });
    if (check.ok) {
      const existing = await check.json();
      sha = existing.sha;
    }

    const body = {
      message: `Upload ${path}`,
      content: base64,
      branch:  branch,
    };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method:  'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept:        'application/vnd.github+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    if (res.ok) {
      showStatus('success', `✓ "${path}" uploaded successfully to ${username}/${repo}`);
    } else {
      const err = await res.json();
      showStatus('error', 'Error: ' + (err.message || res.statusText));
    }
  } catch (e) {
    showStatus('error', 'Error: ' + e.message);
  }

  document.getElementById('uploadBtn').disabled = false;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}
</script>
</body>
</html>
